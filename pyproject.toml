[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-call-replay"
version = "0.1.1"
description = "Replay recorded AI agent tool calls as pytest regressions: normalize traces into deterministic local assertions, reports, and generated tests."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AuraOne", email = "opensource@auraone.ai" }]
keywords = [
  "ai-agents",
  "agent-regression-testing",
  "opentelemetry",
  "pytest",
  "regression-testing",
  "replay",
  "tool-calling",
  "ai agent tool call replay",
  "pytest regressions",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://auraone.ai/open/tool-call-replay"
Source = "https://github.com/auraoneai/tool-call-replay"
Issues = "https://github.com/auraoneai/tool-call-replay/issues"
Documentation = "https://github.com/auraoneai/tool-call-replay#readme"
"Regression Format" = "https://github.com/auraoneai/tool-call-replay/blob/main/README.md#accepted-input-profiles"
Changelog = "https://github.com/auraoneai/tool-call-replay/blob/main/CHANGELOG.md"
Security = "https://github.com/auraoneai/tool-call-replay/security/policy"

[project.scripts]
tool-call-replay = "tool_call_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
